name: ci

on: [push, pull_request]

jobs:
  test:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    # No secrets: releases to the Moodle Marketplace go through release.yml, so disable_release below turns them off here.
    with:
      # The code uses the nullsafe operator, so it does not parse on 7.4, and 8.0 is out of support.
      min_php: '8.1'
      disable_release: true
      disable_phpcs: true
